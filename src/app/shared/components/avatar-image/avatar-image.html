@if (avatarImageConfig().avatarUrl) {
  <img
    class="avatar-image"
    [class.avatar-image--sm]="avatarImageConfig().size === 'sm'"
    [class.avatar-image--md]="avatarImageConfig().size === 'md'"
    [class.avatar-image--lg]="avatarImageConfig().size === 'lg'"
    [src]="avatarImageConfig().avatarUrl"
    alt="Avatar" />} @else {
<div class="avatar-image__placeholder">
  Sin avatar
</div>
}
