<div class="form-field">
  <label>
    {{ config().label }}
  </label>

  <input
    [type]="config().type ?? 'text'"
    [placeholder]="config().placeholder"
    [formField]="config().field"
    [class.input-error]="config().field().invalid() && config().field().touched()"
  />

  @if (config().field().invalid() && config().field().touched()) {
    <span class="error-message">
      {{ getError(config().field().errors()) }}
    </span>
  }
</div>
