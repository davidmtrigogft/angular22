<div class="create-user-container">
  <div class="create-user-container__header">
    <h2>Crear usuario</h2>
    <p>Añade un nuevo usuario al sistema</p>
  </div>

  <form class="user-form" (ngSubmit)="onSubmit()">


    <app-input [config]="nameInput" />

    <app-input [config]="emailInput" />

    <app-input [config]="avatarInput" />

    <div class="create-user-container__buttons">
      @if (userForm()) {
      <button type="submit" class="form-button" [disabled]="userForm().invalid()">
        Crear usuario
      </button>
      }

      <button class="form-button form-button__secondary" (click)="createDefaultUser()">
        Crear usuario por defecto
      </button>
    </div>

  </form>
</div>
