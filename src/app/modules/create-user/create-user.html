<div class="form-card">
  <div class="form-card__header">
    <h2>Crear usuario</h2>
    <p>Añade un nuevo usuario al sistema</p>
  </div>

  <form class="user-form" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label>Nombre</label>
      <input type="text" placeholder="Introduce el nombre" [formField]="userForm.name" />
    </div>

    <div class="form-field">
      <label>Correo electrónico</label>
      <input type="email" placeholder="ejemplo@correo.com" [formField]="userForm.email" />
    </div>

    <div class="form-field">
      <label>Avatar</label>
      <input type="file" (change)="onAvatarSelected($event)" />
    </div>

    <button type="submit" class="form-button">
      Crear usuario
    </button>
  </form>
</div>
