<div class="form-card">
  <div class="form-card__header">
    <h2>Crear usuario</h2>
    <p>Añade un nuevo usuario al sistema</p>
  </div>

  <form class="user-form" (ngSubmit)="onSubmit()">


    <app-input [label]="'Nombre'" [placeholder]="'Introduce el nombre'" [field]="userForm.name" />

    <app-input [label]="'Correo electrónico'" [type]="'email'" [placeholder]="'ejemplo@correo.com'"
      [field]="userForm.email" />

    <app-input [label]="'Avatar URL'" [placeholder]="'https://example.com/avatar.jpg'" [field]="userForm.avatar" />

    @if (userForm()) {
    <button type="submit" class="form-button" [disabled]="userForm().invalid()">
      Crear usuario
    </button>
    }

  </form>
</div>
